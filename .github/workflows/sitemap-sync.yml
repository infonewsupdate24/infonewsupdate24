name: InfoNewsUpdate24 Sitemap & RSS Sync

on:
  schedule:
    # Free-plan refresh: publish new Firestore articles to static Hosting hourly.
    - cron: '7 * * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

concurrency:
  group: infonews-hourly-hosting-sync
  cancel-in-progress: true

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Fresh Sitemaps & RSS Feeds
        run: node scripts/generate_sitemaps.cjs

      - name: Build Web Platform
        run: npm run build

      - name: Deploy Sitemaps to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IN24_NEWS_PLATFORM_6F802 }}
          channelId: live
          projectId: in24-news-platform-6f802
